name: CI

# This package is what people pip install when they adopt the standard. A
# reference implementation that is not tested on every change is a reference
# in name only, and a wrong hash shipped from here propagates into downstream
# implementations as a "correct" reference.
#
# The full matrix is deliberate: pyproject.toml advertises 3.9 through 3.12,
# and an advertised version that nobody runs is a promise, not a fact.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python }}
    # Each leg names its own image because ubuntu-latest has moved to Ubuntu
    # 26.04, and setup-python publishes no 3.9 build for 26.04. The 3.9 leg
    # was failing on the image alone, before any code in this package ran.
    # 3.9 is published up to 24.04, so that one leg pins 24.04 and the rest
    # follow the current image. Removing 3.9 instead would change what
    # pyproject.toml advertises, which is a decision and not a CI fix.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9'
            runner: ubuntu-24.04
          - python: '3.10'
            runner: ubuntu-latest
          - python: '3.11'
            runner: ubuntu-latest
          - python: '3.12'
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # The dev extra pulls pytest plus cryptography and langchain-core, so
      # the optional signing and LangGraph paths are actually exercised
      # rather than silently skipped by importorskip.
      - run: pip install -e ".[dev]"

      - run: pytest -q
